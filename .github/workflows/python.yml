name: Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-provider-lanes:
    name: Classify affected provider lanes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.classify.outputs.lanes }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify affected provider lanes
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            test -n "${BASE_SHA}"
            test -n "${HEAD_SHA}"
            test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
            git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}" |
              python -c 'import json, sys; raw = sys.stdin.buffer.read(); parts = raw.split(b"\0"); assert parts[-1] == b""; json.dump([part.decode("utf-8") for part in parts[:-1]], sys.stdout, separators=(",", ":"))' \
              > affected-paths.json
            python scripts/affected_qualification_lanes.py \
              --registry scripts/provider_qualification_lanes.json \
              < affected-paths.json > affected-lanes.json
          else
            printf '[]\n' > affected-lanes.json
          fi
          LANES="$(cat affected-lanes.json)"
          test -n "${LANES}"
          echo "lanes=${LANES}" >> "${GITHUB_OUTPUT}"

  protected-live-not-applicable:
    name: Protected live explicitly not applicable
    needs: classify-provider-lanes
    if: needs.classify-provider-lanes.outputs.lanes == '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify non-applicability proof
        env:
          LANES: ${{ needs.classify-provider-lanes.outputs.lanes }}
        run: test "${LANES}" = '[]'

  pull-request-candidate:
    name: Exact pull-request candidate
    needs: classify-provider-lanes
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(needs.classify-provider-lanes.outputs.lanes), 'google')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          python-version: "3.14"
          enable-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --python 3.14

      - name: Bind non-publishable candidate identity
        id: identity
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          VERSION="$(uv run --locked --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          uv run --locked --no-sync python scripts/release_qualification.py \
            pull-request-identity \
            --repository "${GITHUB_REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --head-commit "${HEAD_SHA}" \
            --output pull-request-identity.json

      - name: Build source distribution
        run: uv build --no-sources --sdist --out-dir dist

      - name: Build sole wheel from source distribution
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          uv build --no-sources --wheel --out-dir dist
          "dist/cqmgr-${VERSION}.tar.gz"

      - name: Verify exact distributions
        run: uv run --locked --no-sync python scripts/verify_distribution.py dist

      - name: Export locked runtime resolution
        run: >-
          uv export --locked --no-dev --no-emit-project
          --format requirements-txt --output-file candidate-requirements.txt

      - name: Prepare immutable candidate bundle
        run: >-
          uv run --locked --no-sync python scripts/release_qualification.py prepare
          --dist dist
          --identity pull-request-identity.json
          --requirements candidate-requirements.txt
          --output release
          --qualification

      - name: Verify candidate identity and bytes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          uv run --locked --no-sync python scripts/release_qualification.py
          verify-pull-request
          --release release
          --identity pull-request-identity.json
          --repository "${GITHUB_REPOSITORY}"
          --pull-request "${PR_NUMBER}"
          --head-commit "${HEAD_SHA}"

      - name: Upload immutable pull-request candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull-request-candidate
          path: |
            release/*
            pull-request-identity.json
          if-no-files-found: error
          retention-days: 7

  google-protected-live:
    name: Google protected installed qualification
    needs:
      - classify-provider-lanes
      - pull-request-candidate
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(needs.classify-provider-lanes.outputs.lanes), 'google')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    environment: live-read-only
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          python-version: "3.14"
          enable-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --python 3.14

      - name: Download immutable pull-request candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pull-request-candidate
          path: candidate

      - name: Independently verify candidate identity and bytes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          uv run --locked --no-sync python scripts/release_qualification.py
          verify-pull-request
          --release candidate/release
          --identity candidate/pull-request-identity.json
          --repository "${GITHUB_REPOSITORY}"
          --pull-request "${PR_NUMBER}"
          --head-commit "${HEAD_SHA}"

      - name: Authenticate read-only Google identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Qualify installed Compute adapters
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: >-
          uv run --locked --no-sync python
          scripts/installed_live_adapter_qualification.py
          "candidate/release/cqmgr-${{ needs.pull-request-candidate.outputs.version }}-py3-none-any.whl"
          --project-env GCP_PROJECT_ID
          --output installed-live-adapter-evidence.json

      - name: Upload sanitized installed-adapter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull-request-installed-live-adapter-evidence
          path: installed-live-adapter-evidence.json
          if-no-files-found: warn
          retention-days: 14

  performance:
    uses: ./.github/workflows/performance.yml
    permissions:
      contents: read

  quality:
    name: Python quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          python-version: "3.14"
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked --python 3.14

      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check .

      - name: Lint
        run: uv run --locked --no-sync ruff check .

      - name: Type-check
        run: uv run --locked --no-sync pyrefly check --output-format github

      - name: Check package boundaries
        run: uv run --locked --no-sync lint-imports --no-cache

      - name: Check dependency licenses
        run: >-
          uv run --locked --no-sync pip-licenses
          --from mixed
          --allow-only
          "3-Clause BSD License;Apache-2.0;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;Apache Software License;BSD-2-Clause;BSD-3-Clause;BSD License;MIT;MIT-0;MIT License;MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python Software Foundation License"

      - name: Build distributions
        run: uv build --clear --no-sources

      - name: Verify distributions
        run: uv run --locked --no-sync python scripts/verify_distribution.py dist

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked --python "$PYTHON_VERSION"

      - name: Run tests with branch coverage
        run: uv run --locked --no-sync --python "$PYTHON_VERSION" pytest

      - name: Enforce critical domain coverage
        run: >-
          uv run --locked --no-sync --python "$PYTHON_VERSION" coverage report
          --include="src/cqmgr/domain/status.py,src/cqmgr/domain/results.py,src/cqmgr/domain/redaction.py,src/cqmgr/domain/plans.py,src/cqmgr/domain/plan_consumption.py,src/cqmgr/domain/apply_records.py,src/cqmgr/adapters/serialization/plans.py,src/cqmgr/domain/audit.py,src/cqmgr/adapters/persistence/audit.py,src/cqmgr/adapters/persistence/plans.py,src/cqmgr/adapters/persistence/apply_records.py,src/cqmgr/adapters/google/quota_preference_writes.py,src/cqmgr/application/operations/audited_write.py,src/cqmgr/application/operations/apply.py,src/cqmgr/application/ports/plans.py,src/cqmgr/application/ports/apply.py,src/cqmgr/application/ports/apply_records.py,src/cqmgr/application/ports/provider_writes.py,src/cqmgr/domain/watch.py,src/cqmgr/adapters/serialization/watch.py"
          --fail-under=100

  package-smoke:
    name: ${{ matrix.os }} package smoke
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-22.04
          - windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          python-version: "3.14"
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Provision ephemeral Linux Secret Service
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends --yes
          dbus-x11 gnome-keyring

      - name: Exercise native persistence contracts
        run: >-
          uv run --locked --python 3.14 pytest --no-cov -q
          tests/plans/test_plan_repository.py
          -k "concurrent_processes_obtain_at_most_one_lease_and_call_no_provider or
          process_crash_releases_os_lock_without_deleting_shared_state or
          concurrent_different_exports_never_overwrite or
          foreign_key_is_rejected_across_processes_before_provider_dispatch or
          windows_repository_replaces_every_explicit_plan_reader"

      - name: Exercise local persistence and lock contracts
        run: >-
          uv run --locked --python 3.14 pytest --no-cov -q
          tests/persistence

      - name: Smoke-test installed artifacts and native keyring
        if: runner.os != 'Linux'
        run: >-
          uv run --python 3.14 python scripts/smoke_tool_install.py
          dist --python 3.14 --native-keyring-round-trip

      - name: Smoke-test installed artifacts with Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_RUNTIME_DIR="${RUNNER_TEMP}/cqmgr-keyring-runtime"
            mkdir -p "${XDG_RUNTIME_DIR}"
            chmod 700 "${XDG_RUNTIME_DIR}"
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            uv run --python 3.14 python scripts/smoke_tool_install.py \
              dist --python 3.14 --native-keyring-round-trip
          '

  python-qualification:
    name: Python qualification
    needs:
      - classify-provider-lanes
      - google-protected-live
      - package-smoke
      - performance
      - protected-live-not-applicable
      - pull-request-candidate
      - quality
      - tests
    if: always()
    permissions: {}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require complete Python qualification
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.classify-provider-lanes.result }}
          GOOGLE_LIVE_RESULT: ${{ needs.google-protected-live.result }}
          LANES: ${{ needs.classify-provider-lanes.outputs.lanes }}
          NON_APPLICABLE_RESULT: ${{ needs.protected-live-not-applicable.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          PULL_REQUEST_CANDIDATE_RESULT: ${{ needs.pull-request-candidate.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          test "${QUALITY_RESULT}" = "success"
          test "${TESTS_RESULT}" = "success"
          test "${PACKAGE_SMOKE_RESULT}" = "success"
          test "${PERFORMANCE_RESULT}" = "success"

          if [[ "${LANES}" == '[]' ]]; then
            test "${NON_APPLICABLE_RESULT}" = "success"
            test "${PULL_REQUEST_CANDIDATE_RESULT}" = "skipped"
            test "${GOOGLE_LIVE_RESULT}" = "skipped"
          elif [[ "${LANES}" == '["google"]' ]]; then
            test "${NON_APPLICABLE_RESULT}" = "skipped"
            test "${PULL_REQUEST_CANDIDATE_RESULT}" = "success"
            test "${GOOGLE_LIVE_RESULT}" = "success"
          else
            echo "unsupported protected qualification lane set" >&2
            exit 1
          fi
