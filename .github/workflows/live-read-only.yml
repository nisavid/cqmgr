name: Live read-only qualification

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

concurrency:
  group: live-read-only
  cancel-in-progress: false

permissions:
  # Required to check out the exact repository revision.
  contents: read

jobs:
  canary:
    name: Bounded keyless provider reads
    # ubuntu-22.04 remains a supported stable GitHub-hosted runner label.
    runs-on: ubuntu-22.04
    # The protected environment supplies all three GCP values directly to this
    # job; workflow callers cannot inject or override them.
    timeout-minutes: 15
    environment: live-read-only
    permissions:
      # Required to check out the exact repository revision.
      contents: read
      # Required by google-github-actions/auth for OIDC-based GCP authentication.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate with workload identity federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          python-version: "3.14"
          enable-cache: false

      - name: Synchronize locked runtime
        run: uv sync --locked --no-dev --python 3.14

      - name: Run bounded allowlisted canary
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: >-
          uv run --locked --no-dev --no-sync
          python scripts/live_read_only_canary.py
          --project-env GCP_PROJECT_ID
          --max-pages 50
          --max-requests 100
          --max-seconds 120
          --max-locations 100
          --timeout 10
          --output live-read-only-evidence.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-read-only-evidence
          path: live-read-only-evidence.json
          if-no-files-found: error
          retention-days: 14
