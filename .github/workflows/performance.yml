name: Performance qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  performance:
    name: ${{ matrix.runner }} performance qualification
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - ubuntu-22.04
          - windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.30
          python-version: "3.14"
          enable-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --python 3.14

      - name: Measure and enforce performance budgets
        run: >-
          uv run --locked --no-sync
          python scripts/measure_performance.py
          --output performance-${{ matrix.runner }}.json
          --budgets docs/release/performance-budgets.json

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ matrix.runner }}
          path: performance-${{ matrix.runner }}.json
          if-no-files-found: error
