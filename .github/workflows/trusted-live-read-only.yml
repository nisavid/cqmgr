name: Trusted pull-request live read-only qualification

on:
  workflow_call:
    inputs:
      head-sha:
        description: Exact same-repository pull-request head SHA.
        required: true
        type: string
      pull-request-number:
        description: Pull-request number bound into the candidate identity.
        required: true
        type: number

permissions: {}

jobs:
  trust-caller:
    name: Verify trusted caller
    permissions: {}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Reject untrusted caller context
        shell: bash
        env:
          CALLER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CALLER_PR_NUMBER: ${{ github.event.pull_request.number }}
          CALLER_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
          EXPECTED_PR_NUMBER: ${{ inputs.pull-request-number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "${EVENT_NAME}" = "pull_request"
          test "${CALLER_REPOSITORY}" = "nisavid/cqmgr"
          test "${HEAD_REPOSITORY}" = "${CALLER_REPOSITORY}"
          test "${EXPECTED_HEAD_SHA}" = "${CALLER_HEAD_SHA}"
          test "${EXPECTED_PR_NUMBER}" = "${CALLER_PR_NUMBER}"
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]

  qualify-candidate:
    name: Protected installed Compute qualification
    needs: trust-caller
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    environment: live-read-only
    permissions:
      # Required only to check out the immutable reusable-workflow revision.
      contents: read
      # Required only by the pinned workload-identity authentication step.
      id-token: write
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout trusted workflow source
        # GitHub.com binds these properties to the called workflow revision;
        # there is intentionally no mutable or GHES compatibility fallback.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30
          python-version: "3.14"
          enable-cache: false

      - name: Download same-run pull-request candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pull-request-candidate
          path: candidate

      - name: Verify exact candidate identity and bytes
        id: verify
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
          EXPECTED_PR_NUMBER: ${{ inputs.pull-request-number }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: >-
          uv run --python 3.14 --no-project python
          trusted/scripts/verify_pull_request_candidate.py
          --candidate candidate
          --repository "${EXPECTED_REPOSITORY}"
          --pull-request "${EXPECTED_PR_NUMBER}"
          --head-sha "${EXPECTED_HEAD_SHA}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Authenticate with workload identity federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run installed bounded Compute qualification
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERIFIED_WHEEL: ${{ steps.verify.outputs.wheel }}
        run: >-
          uv run --python 3.14 --no-project python
          trusted/scripts/installed_live_adapter_qualification.py
          "${VERIFIED_WHEEL}"
          --project-env GCP_PROJECT_ID
          --output installed-live-adapter-evidence.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull-request-live-read-only-evidence
          path: installed-live-adapter-evidence.json
          if-no-files-found: warn
          retention-days: 14
